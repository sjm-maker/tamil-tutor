<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>தமிழ் எழுத்துப் பயிற்சி</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Mukta Malar', 'Noto Sans Tamil', sans-serif;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 16px 8px;
      min-height: 100vh;
    }
    .tutor-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 12px 30px -8px rgba(30, 41, 59, 0.08);
      padding: 20px 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .nav-container {
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 2px 14px;
      margin-bottom: 8px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .nav-container::-webkit-scrollbar { display: none; }
    .nav-pills {
      display: inline-flex;
      gap: 6px;
    }
    .pill {
      min-width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
      font-size: 18px;
      border: 1.5px solid #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pill.active {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #ffffff;
      border-color: transparent;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 6px;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin: 4px 0 14px;
    }
    .canvas-wrap {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      border-radius: 20px;
      background: #fafaf9;
      border: 2px dashed #cbd5e1;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 320px;
      touch-action: none;
    }
    #bgCanvas { opacity: 0.16; }
    .instruction {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      margin: 14px 0 10px;
      min-height: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.97); }
    .btn-audio {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-reset {
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="tutor-card">
  <!-- Horizontal scrollable letter selection -->
  <div class="nav-container">
    <div class="nav-pills" id="selector"></div>
  </div>

  <div class="badge" id="letterBadge">உயிர் எழுத்து</div>
  <div class="title" id="letterTitle">எழுதிப் பழகு</div>

  <div class="canvas-wrap">
    <canvas id="bgCanvas" width="320" height="320"></canvas>
    <canvas id="drawCanvas" width="320" height="320"></canvas>
  </div>

  <div class="instruction" id="feedback">வரிசையாக இணைக்கவும்</div>

  <div class="actions">
    <button class="btn-audio" onclick="playAudio()">🔊 ஒலி</button>
    <button class="btn-reset" onclick="resetPractice()">மீண்டும்</button>
  </div>
</div>

<script>
  let letters = [];
  let currentIdx = 0;
  let waypoints = [];
  let activeIndex = 0;
  let strokes = []; // stores stroke paths
  let currentStroke = [];
  let isDrawing = false;

  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const drawCanvas = document.getElementById('drawCanvas');
  const ctx = drawCanvas.getContext('2d');
  const feedback = document.getElementById('feedback');
  const selector = document.getElementById('selector');

  fetch('./data.json')
    .then(res => res.json())
    .then(data => {
      letters = data;
      initPills();
      loadLetter(0);
    });

  function initPills() {
    selector.innerHTML = '';
    letters.forEach((item, idx) => {
      const pill = document.createElement('div');
      pill.className = `pill ${idx === currentIdx ? 'active' : ''}`;
      pill.innerText = item.letter;
      pill.onclick = () => loadLetter(idx);
      selector.appendChild(pill);
    });
  }

  function loadLetter(idx) {
    currentIdx = idx;
    const cur = letters[idx];
    document.getElementById('letterBadge').innerText = `${cur.category || 'உயிர் எழுத்து'} • ${cur.type}`;
    document.getElementById('letterTitle').innerText = `எழுதிப் பழகு: ${cur.letter}`;
    feedback.innerText = cur.desc;
    feedback.style.color = '#475569';

    waypoints = cur.waypoints.map(w => ({ ...w, hit: false }));
    activeIndex = 0;
    strokes = [];
    currentStroke = [];

    document.querySelectorAll('.pill').forEach((p, i) => {
      p.className = `pill ${i === currentIdx ? 'active' : ''}`;
    });

    renderBackground();
    redrawCanvas();
  }

  function renderBackground() {
    bgCtx.clearRect(0, 0, 320, 320);
    bgCtx.font = "210px 'Mukta Malar', 'Noto Sans Tamil', sans-serif";
    bgCtx.fillStyle = "#0f172a";
    bgCtx.textAlign = "center";
    bgCtx.textBaseline = "middle";
    bgCtx.fillText(letters[currentIdx].letter, 160, 160);
  }

  // Pure stroke rendering: Round butt / lineCap with glowing magical gradient
  function redrawCanvas() {
    ctx.clearRect(0, 0, 320, 320);

    const gradient = ctx.createLinearGradient(40, 40, 280, 280);
    gradient.addColorStop(0, '#ec4899');   // Vibrant Pink
    gradient.addColorStop(0.5, '#8b5cf6'); // Royal Purple
    gradient.addColorStop(1, '#3b82f6');   // Bright Blue

    ctx.lineWidth = 14;
    ctx.lineCap = 'round';   // Clean round cap
    ctx.lineJoin = 'round';  // Smooth joint
    ctx.strokeStyle = gradient;
    ctx.shadowColor = 'rgba(139, 92, 246, 0.45)';
    ctx.shadowBlur = 10;

    // Draw past strokes
    strokes.forEach(path => {
      if (path.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
      }
      ctx.stroke();
    });

    // Draw active live stroke
    if (currentStroke.length > 1) {
      ctx.beginPath();
      ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
      for (let i = 1; i < currentStroke.length; i++) {
        ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
      }
      ctx.stroke();
    }

    // Reset shadow for crisp waypoint dots
    ctx.shadowBlur = 0;
    drawWaypoints();
  }

  function drawWaypoints() {
    waypoints.forEach((pt, idx) => {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
      ctx.fillStyle = pt.hit ? "#10b981" : (idx === activeIndex ? "#f59e0b" : "#cbd5e1");
      ctx.fill();

      // White outline ring for active target
      if (idx === activeIndex) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
      }

      ctx.fillStyle = pt.hit || idx === activeIndex ? "#ffffff" : "#475569";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(pt.label, pt.x, pt.y);
    });
  }

  function checkProximity(x, y) {
    if (activeIndex >= waypoints.length) return;
    const target = waypoints[activeIndex];
    const dist = Math.hypot(target.x - x, target.y - y);
    if (dist < 28) {
      target.hit = true;
      activeIndex++;
      if (activeIndex === waypoints.length) {
        feedback.innerText = "அருமை! சரியாக எழுதிவிட்டீர்கள் 🎉";
        feedback.style.color = "#10b981";
      }
    }
  }

  function getCoordinates(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (320 / rect.width),
      y: (clientY - rect.top) * (320 / rect.height)
    };
  }

  drawCanvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    const pos = getCoordinates(e);
    currentStroke = [pos];
    checkProximity(pos.x, pos.y);
    redrawCanvas();
  });

  drawCanvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    const pos = getCoordinates(e);
    currentStroke.push(pos);
    checkProximity(pos.x, pos.y);
    redrawCanvas();
  });

  window.addEventListener('pointerup', () => {
    if (isDrawing && currentStroke.length > 0) {
      strokes.push(currentStroke);
      currentStroke = [];
      isDrawing = false;
      redrawCanvas();
    }
  });

  function resetPractice() {
    waypoints.forEach(p => p.hit = false);
    activeIndex = 0;
    strokes = [];
    currentStroke = [];
    feedback.innerText = letters[currentIdx].desc;
    feedback.style.color = "#475569";
    redrawCanvas();
  }

  function playAudio() {
    if ('speechSynthesis' in window) {
      const utter = new SpeechSynthesisUtterance(letters[currentIdx].letter);
      utter.lang = "ta-IN";
      window.speechSynthesis.speak(utter);
    }
  }
</script>
</body>
</html>
